name: Build Furina Windows desktop pet

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/furina-lite
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: furina-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Furina v2 resources
        shell: pwsh
        run: |
          $pet = Get-Content pets/furina--lingxiaotian/pet.json -Raw | ConvertFrom-Json
          if ($pet.id -ne "furina--lingxiaotian") { throw "Unexpected Furina pet id." }
          if ($pet.spriteVersionNumber -ne 2) { throw "Furina must remain a v2 pet." }
          $canonical = "pets/furina--lingxiaotian/$($pet.spriteSheetPath)"
          $bundled = "public/assets/furina-pet-spritesheet.webp"
          if (-not (Test-Path $canonical) -or -not (Test-Path $bundled)) { throw "Furina spritesheet is missing." }
          if ((Get-FileHash $canonical).Hash -ne (Get-FileHash $bundled).Hash) { throw "Bundled spritesheet differs from the v2 pet package." }

      - name: Build frontend
        run: pnpm build

      - name: Build Windows installer
        shell: pwsh
        run: |
          pnpm desktop:build 2>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content tauri-build.log -Tail 80) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Tauri build failed::$escaped"
            exit $LASTEXITCODE
          }

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log

      - name: Prepare tagged release executable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($tauri.version -ne $version) {
            throw "Tag version $version does not match Tauri version $($tauri.version)."
          }

          New-Item -ItemType Directory -Path release -Force | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "Furina installer was not produced." }
          $releaseName = "芙宁娜桌宠-Windows-$tag.exe"
          Copy-Item $installer.FullName "release/$releaseName"

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "release/芙宁娜桌宠-Windows-${{ github.ref_name }}.exe" --repo "${{ github.repository }}" --title "芙宁娜桌宠 ${{ github.ref_name }}" --generate-notes --verify-tag
