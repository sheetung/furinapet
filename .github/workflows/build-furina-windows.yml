name: Build Furina Windows desktop pet

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/furina-lite
      - furinapet-neuro
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: furina-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate character registry and Furina v2 resources
        shell: pwsh
        run: |
          $pet = Get-Content pets/furina--lingxiaotian/pet.json -Raw | ConvertFrom-Json
          if ($pet.id -ne "furina--lingxiaotian") { throw "Unexpected Furina pet id." }
          if ($pet.spriteVersionNumber -ne 2) { throw "Furina must remain a v2 pet." }
          $canonical = "pets/furina--lingxiaotian/$($pet.spriteSheetPath)"
          $registered = "characters/furina/spritesheet.webp"
          if (-not (Test-Path $canonical) -or -not (Test-Path $registered)) { throw "Furina spritesheet is missing." }
          if ((Get-FileHash $canonical).Hash -ne (Get-FileHash $registered).Hash) { throw "Registered Furina spritesheet differs from the v2 pet package." }

          $manifests = Get-ChildItem characters -Directory | ForEach-Object {
            $manifestPath = Join-Path $_.FullName "character.json"
            if (-not (Test-Path $manifestPath)) { throw "Missing character.json in $($_.Name)." }
            foreach ($asset in @("avatar.png", "thumbnail.png", "spritesheet.webp")) {
              if (-not (Test-Path (Join-Path $_.FullName $asset))) { throw "Missing $asset in $($_.Name)." }
            }
            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.id -ne $_.Name) { throw "Character id must match directory name: $($_.Name)." }
            if ($manifest.id -notmatch '^[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?$') { throw "Character id is invalid: $($manifest.id)." }
            if ($manifest.spriteVersionNumber -ne 2 -or $manifest.cellWidth -ne 192 -or $manifest.cellHeight -ne 208 -or $manifest.columns -ne 8 -or $manifest.rows -ne 11) {
              throw "Character $($_.Name) does not satisfy the v2 sprite contract."
            }
            $manifest
          }
          if (@($manifests).Count -lt 1) { throw "At least one character must be registered." }
          if (@($manifests | Where-Object isDefault).Count -ne 1) { throw "Exactly one character must be the default." }

          $onlineCatalog = Get-Content online-characters/catalog.json -Raw | ConvertFrom-Json
          if ($onlineCatalog.schemaVersion -ne 1) { throw "Unsupported online character catalog schema." }
          $onlineIds = @($onlineCatalog.characters)
          if (@($onlineIds | Select-Object -Unique).Count -ne $onlineIds.Count) { throw "Online character ids must be unique." }
          foreach ($id in $onlineIds) {
            if ($id -notmatch '^[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?$') { throw "Online character id is invalid: $id." }
            $directory = "online-characters/$id"
            foreach ($asset in @("character.json", "avatar.png", "thumbnail.png", "spritesheet.webp")) {
              if (-not (Test-Path "$directory/$asset")) { throw "Online character $id is missing $asset." }
            }
            $manifest = Get-Content "$directory/character.json" -Raw | ConvertFrom-Json
            if ($manifest.id -ne $id) { throw "Online character id must match its directory: $id." }
            if ($manifest.packageVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Online character $id must provide a semantic packageVersion." }
            if ($manifest.spriteVersionNumber -ne 2 -or $manifest.cellWidth -ne 192 -or $manifest.cellHeight -ne 208 -or $manifest.columns -ne 8 -or $manifest.rows -ne 11) {
              throw "Online character $id does not satisfy the v2 sprite contract."
            }
          }

      - name: Build frontend
        run: pnpm build

      - name: Build Windows installer
        shell: pwsh
        run: |
          pnpm desktop:build 2>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content tauri-build.log -Tail 80) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Tauri build failed::$escaped"
            exit $LASTEXITCODE
          }

      - name: Smoke test built-in MCP server
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src-tauri/target/release/furina-desktop-pet.exe").Path
          $initialize = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"furinapet-ci","version":"1"}}}'
          $initialized = '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
          $listTools = '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $exe
          $startInfo.ArgumentList.Add("mcp")
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true

          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo
          if (-not $process.Start()) { throw "Failed to start built-in MCP server." }

          $stdoutTask = $process.StandardOutput.ReadToEndAsync()
          $stderrTask = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine($initialize)
          $process.StandardInput.WriteLine($initialized)
          $process.StandardInput.WriteLine($listTools)
          $process.StandardInput.Close()

          if (-not $process.WaitForExit(10000)) {
            $process.Kill($true)
            throw "Built-in MCP process did not exit after stdin closed."
          }

          $stdout = $stdoutTask.GetAwaiter().GetResult()
          $stderr = $stderrTask.GetAwaiter().GetResult()
          if ($process.ExitCode -ne 0) {
            throw "Built-in MCP process exited with $($process.ExitCode). stderr: $stderr"
          }

          $responses = @($stdout -split "\r?\n" | Where-Object { $_.Trim() })
          $parsed = @($responses | ForEach-Object { $_ | ConvertFrom-Json })
          $init = @($parsed | Where-Object { $_.id -eq 1 })[0]
          $tools = @($parsed | Where-Object { $_.id -eq 2 })[0]
          if (-not $init.result.serverInfo -or $init.result.serverInfo.name -ne "furinapet") { throw "MCP initialize response is invalid." }
          if (-not $tools.result.tools) { throw "MCP tools/list response is invalid." }

          $names = @($tools.result.tools | ForEach-Object { $_.name })
          foreach ($required in @("furinapet_status", "furinapet_set_state", "furinapet_react", "furinapet_say")) {
            if ($required -notin $names) { throw "MCP tool missing: $required" }
          }

      - name: Upload installer artifact
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: furinapet-agent-mcp-windows-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log

      - name: Prepare tagged release executable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($tauri.version -ne $version) {
            throw "Tag version $version does not match Tauri version $($tauri.version)."
          }
          $metadata = Get-Content release.json -Raw | ConvertFrom-Json
          if ($metadata.version -ne $version) {
            throw "Release metadata version $($metadata.version) does not match tag version $version."
          }

          New-Item -ItemType Directory -Path release -Force | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "Furina installer was not produced." }
          $releaseName = "furinapet-Windows-$tag.exe"
          Copy-Item $installer.FullName "release/$releaseName"
          $releaseInstaller = Get-Item "release/$releaseName"
          $manifest = [ordered]@{
            version = $version
            title = $metadata.title
            notes = @($metadata.notes)
            downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$releaseName"
            sha256 = (Get-FileHash $releaseInstaller.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            size = $releaseInstaller.Length
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content release/update.json -Encoding utf8

          $previousTag = git tag --sort=-version:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
          $releaseNotes = @("## 更新内容", "")
          $releaseNotes += @($metadata.notes | ForEach-Object { "- $_" })
          if ($previousTag) {
            $releaseNotes += ""
            $releaseNotes += "**Full Changelog**: [$previousTag...$tag](https://github.com/${{ github.repository }}/compare/$previousTag...$tag)"
          }
          $releaseNotes | Set-Content release/notes.md -Encoding utf8

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "release/furinapet-Windows-${{ github.ref_name }}.exe" "release/update.json" --repo "${{ github.repository }}" --title "furinapet ${{ github.ref_name }}" --notes-file "release/notes.md" --verify-tag
