name: Tag release from main version

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - release.json
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
      - .github/workflows/tag-release.yml

permissions:
  contents: write
  actions: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./release.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)

          test "$VERSION" = "$PACKAGE_VERSION" || { echo "release.json/package.json version mismatch"; exit 1; }
          test "$VERSION" = "$TAURI_VERSION" || { echo "release.json/tauri.conf.json version mismatch"; exit 1; }
          test "$VERSION" = "$CARGO_VERSION" || { echo "release.json/Cargo.toml version mismatch"; exit 1; }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release tag when missing
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; nothing to create."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "furinapet $TAG" "${GITHUB_SHA}"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Trigger tagged Windows release build
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run build-furina-windows.yml --ref "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}"
