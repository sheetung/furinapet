name: Build plugin-system Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - feat/plugin-system

permissions:
  contents: read

concurrency:
  group: plugin-system-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri NSIS installer
        run: pnpm desktop:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: furinapet-plugin-system-windows-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-system-build-debug-${{ github.run_number }}
          path: |
            src-tauri/target/release/build
            src-tauri/target/release/deps
          if-no-files-found: ignore
          retention-days: 3
