<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Motion stack preview</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        display: flex;
        gap: 24px;
        padding: 20px;
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif;
        background: #10151f;
        color: #dbe6f5;
      }
      /* Checkerboard so a transparent clear colour is obvious. */
      #stage {
        width: 384px;
        height: 416px;
        background-image:
          linear-gradient(45deg, #1b2331 25%, transparent 25%, transparent 75%, #1b2331 75%),
          linear-gradient(45deg, #1b2331 25%, transparent 25%, transparent 75%, #1b2331 75%);
        background-size: 24px 24px;
        background-position: 0 0, 12px 12px;
        border: 1px solid #2c3a52;
      }
      button { margin: 0 6px 6px 0; padding: 5px 10px; }
      #status { min-height: 20px; margin: 8px 0; color: #f0b26a; }
      pre { margin: 0; font-size: 12px; color: #8fbdf0; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div>
      <p>Move the cursor over the checkerboard to drive Aim IK. Pick an intent:</p>
      <div id="controls"></div>
      <p id="status"></p>
      <pre id="diagnostics">loading…</pre>
    </div>
    <script type="module" src="/dev/motion-preview.ts"></script>
  </body>
</html>
